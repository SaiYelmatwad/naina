server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any non-file route goes to index.html so React Router
    # can handle client-side routing (e.g. a hard refresh on /applications).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container by its Compose service name.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
